                  remarks: "address address_id"
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: building
                  type: integer
                  remarks: "address building"
                  constraints:
                    nullable: true
              - column:
                  name: street
                  type: varchar(50)
                  remarks: "address street"
                  constraints:
                    nullable: true
              - column:
                  name: city
                  type: varchar(50)
                  remarks: "address city"
                  constraints:
                    nullable: true
              - column:
                  name: region
                  type: varchar(50)
                  remarks: "address region"
                  constraints:
                    nullable: true

