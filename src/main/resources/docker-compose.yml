version: '3.8'

services:
  postgres-prod:
    image: postgres:13
    container_name: postgres-prod
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: prod_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:13
    container_name: postgres-test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: test_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-prod-data:
  postgres-test-data: